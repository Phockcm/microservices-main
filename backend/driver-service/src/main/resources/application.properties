spring.application.name=driver-service
server.port=8081

# MySQL XAMPP (mặc định user=root, password rỗng nếu chưa đổi trong XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/driver_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
