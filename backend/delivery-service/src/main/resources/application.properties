spring.application.name=delivery-service
server.port=8082

# =========================================================================
# CẤU HÌNH MẶC ĐỊNH: MySQL XAMPP (delivery_db)
# =========================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/delivery_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================================
# TÙY CHỌN SQL SERVER (Bỏ comment nếu giảng viên yêu cầu Service 2 dùng SQL Server)
# =========================================================================
# spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=delivery_db;encrypt=true;trustServerCertificate=true
# spring.datasource.username=sa
# spring.datasource.password=${SQLSERVER_PASSWORD}
# spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
